# Local Postgres for development. Run `docker compose up -d` to start,
# then `npx prisma migrate dev` and `npm run seed`.
services:
  postgres:
    image: postgres:16
    container_name: clinkdeck-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: toast
      POSTGRES_PASSWORD: toast
      POSTGRES_DB: toast
    volumes:
      - clinkdeck_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toast -d toast"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  clinkdeck_pgdata:
